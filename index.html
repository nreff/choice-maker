<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choice Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body>
<main>
  <h1>CHOICE MAKER</h1>

  <section id="setup">
    <label for="count">HOW MANY CHOICES?</label>
    <input id="count" type="number" min="2" max="20" value="3" inputmode="numeric">
    <div id="fields"></div>
    <div class="err" id="err" role="alert"></div>
    <button id="go">GO &gt;</button>
  </section>

  <section id="play" class="hidden">
    <div id="picker" role="group" aria-label="Choose how to decide"></div>
    <div id="stage"></div>
    <div id="hint"></div>
    <button id="action">GO!</button><br>
    <button id="share" class="ghost">COPY SHARE LINK</button><br>
    <button id="back" class="ghost">&lt; EDIT</button>
  </section>
</main>

<script src="js/core.js"></script>
<script src="js/games/eightball.js"></script>
<script src="js/games/wheel.js"></script>
<script src="js/games/dice.js"></script>
<script src="js/games/coin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
